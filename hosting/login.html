<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FCOS — Login</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-card__logo">FCOS</div>
    <div class="auth-card__subtitle">FUCHS Commercial Operating System</div>

    <div id="alert-msg" class="alert"></div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" class="form-control"
             placeholder="nama@fuchs.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" class="form-control"
             placeholder="Password" autocomplete="current-password">
    </div>

    <button id="btn-login" class="btn btn--primary btn--full">Login</button>

    <div class="auth-card__footer">
      <a href="#" id="link-forgot">Lupa password?</a>
      &nbsp;·&nbsp;
      <a href="/register.html">Daftar akun baru</a>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/api.js"></script>

<script>
  var emailEl    = document.getElementById('email')
  var passwordEl = document.getElementById('password')
  var btnLogin   = document.getElementById('btn-login')
  var linkForgot = document.getElementById('link-forgot')

  firebase.auth().onAuthStateChanged(function (firebaseUser) {
    if (!firebaseUser) return
    firebaseUser.getIdToken(true)
      .then(function (token) {
        window.FCOS.authToken = token
        return FCOS.api('getMe', 'GET')
      })
      .then(function (user) { redirectByStatus(user.status) })
      .catch(function () { firebase.auth().signOut() })
  })

  btnLogin.addEventListener('click', handleLogin)
  passwordEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') handleLogin()
  })

  async function handleLogin() {
    var email    = emailEl.value.trim()
    var password = passwordEl.value
    clearMsg()
    if (!email || !password) {
      showMsg('error', 'Email dan password wajib diisi.')
      return
    }
    setLoading(btnLogin, 'Masuk...')
    try {
      var cred  = await firebase.auth().signInWithEmailAndPassword(email, password)
      var token = await cred.user.getIdToken(true)
      window.FCOS.authToken = token
      var user = await FCOS.api('getMe', 'GET')
      redirectByStatus(user.status)
    } catch (err) {
      showMsg('error', friendlyError(err.code || err.message))
      resetLoading(btnLogin, 'Login')
    }
  }

  linkForgot.addEventListener('click', async function (e) {
    e.preventDefault()
    var email = emailEl.value.trim()
    if (!email) {
      showMsg('error', 'Masukkan email kamu terlebih dahulu, lalu klik Lupa Password.')
      return
    }
    linkForgot.style.pointerEvents = 'none'
    linkForgot.textContent         = 'Mengirim...'
    try {
      await firebase.auth().sendPasswordResetEmail(email)
    } catch (err) {}
    finally {
      linkForgot.style.pointerEvents = ''
      linkForgot.textContent         = 'Lupa password?'
    }
    showMsg('success', 'Jika email terdaftar, link reset password sudah dikirim. Cek inbox kamu.')
  })

  function redirectByStatus(status) {
    if (status === 'ACTIVE')   { window.location.href = '/dashboard.html';        return }
    if (status === 'PENDING')  { window.location.href = '/waiting-approval.html'; return }
    if (status === 'INACTIVE') { window.location.href = '/access-denied.html';    return }
    window.location.href = '/access-denied.html'
  }

  function showMsg(type, msg) {
    var el = document.getElementById('alert-msg')
    el.textContent = msg; el.className = 'alert alert--' + type; el.style.display = 'block'
  }
  function clearMsg() {
    var el = document.getElementById('alert-msg')
    el.style.display = 'none'; el.textContent = ''
  }
  function setLoading(btn, text) {
    btn.disabled = true; btn.textContent = text
  }
  function resetLoading(btn, text) {
    btn.disabled = false; btn.textContent = text
  }
  function friendlyError(code) {
    var map = {
      'auth/user-not-found'         : 'Email tidak terdaftar.',
      'auth/wrong-password'         : 'Password salah.',
      'auth/invalid-credential'     : 'Email atau password salah.',
      'auth/invalid-email'          : 'Format email tidak valid.',
      'auth/too-many-requests'      : 'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.',
      'auth/user-disabled'          : 'Akun ini telah dinonaktifkan oleh administrator.',
      'auth/network-request-failed' : 'Koneksi gagal. Periksa jaringan kamu.'
    }
    return map[code] || 'Login gagal. Silakan coba lagi.'
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FCOS — PSM Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar__logo">Fuchs Lubricants Indonesia - OSS</div>
    <nav class="sidebar__nav" id="sidebar-nav"></nav>
    <div class="sidebar__footer" id="sidebar-footer"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__title">Price Special Management</div>
      <div class="topbar__user">
        <span id="topbar-name"></span>
        <button class="btn btn--secondary btn--sm" id="btn-logout">Logout</button>
      </div>
    </header>

    <div class="content">
      <div id="loading" class="text-muted">Memuat...</div>
      <div id="main-content" class="hidden">

        <div class="page-header">
          <div>
            <div class="page-header__title">Price Special Management</div>
            <div class="page-header__subtitle" id="list-subtitle"></div>
          </div>
          <button class="btn btn--primary" id="btn-create">+ New PSM</button>
        </div>

        <!-- Status Filter -->
        <div style="display:flex; gap:12px; align-items:center; margin-bottom:16px; flex-wrap:wrap;">
          <div class="filter-tabs" id="filter-status">
            <button class="filter-tab active" data-status="">Semua</button>
            <button class="filter-tab" data-status="DRAFT">Draft</button>
            <button class="filter-tab" data-status="SUBMITTED">Submitted</button>
            <button class="filter-tab" data-status="PENDING">Pending</button>
            <button class="filter-tab" data-status="APPROVED">Approved</button>
            <button class="filter-tab" data-status="REJECTED">Rejected</button>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>PSM Number</th>
                <th>Customer</th>
                <th>Status</th>
                <th>Created By</th>
                <th>Created At</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="6" class="table-empty">Loading PSM records...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div id="pagination" style="display:flex; gap:8px; align-items:center; margin-top:16px; justify-content:flex-end;"></div>

      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/psm-list.js"></script>

</body>
</html>

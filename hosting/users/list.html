<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FCOS — User Registry</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar__logo">FCOS</div>
    <nav class="sidebar__nav">
      <div class="sidebar__section-label">Administrasi</div>
      <a href="/users/list.html" class="active">User Registry</a>
      <a href="/organization/list.html">Organization Hierarchy</a>
      <div class="sidebar__section-label">Product</div>
      <a href="/products/list.html">Product Registry</a>
      <a href="/products/families.html">Product Families</a>
      <a href="/products/mapping.html">Family Mapping</a>
    </nav>
    <div class="sidebar__footer" id="sidebar-footer"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__title">User Registry</div>
      <div class="topbar__user">
        <span id="topbar-name"></span>
        <button class="btn btn--secondary btn--sm" id="btn-logout">Logout</button>
      </div>
    </header>

    <div class="content">
      <div id="loading" class="text-muted">Memuat...</div>
      <div id="main-content" class="hidden">

        <div class="page-header">
          <div>
            <div class="page-header__title">User Registry</div>
            <div class="page-header__subtitle" id="list-subtitle"></div>
          </div>
        </div>

        <div class="filter-tabs" id="filter-tabs">
          <button class="filter-tab active" data-status="">Semua</button>
          <button class="filter-tab" data-status="PENDING">Pending</button>
          <button class="filter-tab" data-status="ACTIVE">Active</button>
          <button class="filter-tab" data-status="INACTIVE">Inactive</button>
        </div>

        <div class="table-wrapper">
          <table class="table table--clickable">
            <thead>
              <tr>
                <th>Nama</th>
                <th>Email</th>
                <th>Status</th>
                <th>Role</th>
                <th>Terdaftar</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="5" class="table-empty">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/utils.js"></script>

<script>
  var currentFilter = ''

  FCOS.initPage().then(function (user) {
    FCOS.requirePageRole('SUPER_ADMIN', 'ADMIN')

    document.getElementById('topbar-name').textContent  = user.name
    document.getElementById('sidebar-footer').innerHTML =
      '<div>' + escHtml(user.name) + '</div>' +
      '<div class="mt-4 text-small">' + FCOS.formatRoles(user.roles) + '</div>'

    document.getElementById('loading').style.display = 'none'
    document.getElementById('main-content').classList.remove('hidden')

    loadUsers('')
  })

  async function loadUsers(status) {
    var tbody = document.getElementById('table-body')
    tbody.innerHTML = '<tr><td colspan="5" class="table-empty">Memuat...</td></tr>'

    try {
      var params = status ? { status: status } : {}
      var data   = await FCOS.api('listUsers', 'GET', null, params)
      var users  = data.users || []

      var filterLabel = status ? status.toLowerCase() : 'semua'
      document.getElementById('list-subtitle').textContent =
        users.length + ' user (' + filterLabel + ')'

      if (users.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="5" class="table-empty">Tidak ada user.</td></tr>'
        return
      }

      tbody.innerHTML = users.map(function (u) {
        return '<tr onclick="goToDetail(\'' + u.uid + '\')" style="cursor:pointer;">' +
          '<td>' + escHtml(u.name)  + '</td>' +
          '<td>' + escHtml(u.email) + '</td>' +
          '<td>' + FCOS.statusBadge(u.status) + '</td>' +
          '<td>' + FCOS.formatRoles(u.roles)  + '</td>' +
          '<td>' + FCOS.formatDate(u.created_at) + '</td>' +
          '</tr>'
      }).join('')

    } catch (err) {
      tbody.innerHTML =
        '<tr><td colspan="5" class="table-empty text-danger">' +
        'Gagal memuat data: ' + escHtml(err.message) +
        '</td></tr>'
    }
  }

  function goToDetail(uid) {
    window.location.href = '/users/detail.html?uid=' + encodeURIComponent(uid)
  }

  document.getElementById('filter-tabs').addEventListener('click', function (e) {
    var tab = e.target.closest('.filter-tab')
    if (!tab) return
    document.querySelectorAll('.filter-tab').forEach(function (t) {
      t.classList.remove('active')
    })
    tab.classList.add('active')
    currentFilter = tab.dataset.status
    loadUsers(currentFilter)
  })

  document.getElementById('btn-logout').addEventListener('click', function () {
    FCOS.logout()
  })

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FCOS</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card" style="text-align:center; max-width:460px;">

    <div class="auth-card__logo">FCOS</div>
    <div class="auth-card__subtitle">FUCHS Commercial Operating System</div>

    <div style="margin: 28px 0 16px;">
      <svg width="56" height="56" viewBox="0 0 56 56"
           fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="28" cy="28" r="28" fill="#DCFCE7"/>
        <path d="M18 28l7 7 13-13"
              stroke="#166534" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h2 style="font-size:1.1rem; font-weight:700; color:#1a1a2e; margin-bottom:10px;">
      Login Berhasil
    </h2>

    <p id="welcome-msg"
       style="font-size:0.9rem; color:#64748b; margin-bottom:28px; line-height:1.7;">
      Memuat akun...
    </p>

    <button id="btn-logout" class="btn btn--secondary btn--sm">Logout</button>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>

<script>
  FCOS.initPage().then(function (user) {
    document.getElementById('welcome-msg').textContent =
      'Selamat datang, ' + user.name + '. Dashboard sedang dalam pengembangan.'
  })

  document.getElementById('btn-logout').addEventListener('click', function () {
    FCOS.logout()
  })
</script>

</body>
</html>

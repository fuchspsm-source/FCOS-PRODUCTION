<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FCOS — Dashboard</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar__logo">FCOS</div>
    <nav class="sidebar__nav" id="sidebar-nav"></nav>
    <div class="sidebar__footer" id="sidebar-footer"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__title">Dashboard</div>
      <div class="topbar__user">
        <span id="topbar-name"></span>
        <button class="btn btn--secondary btn--sm" id="btn-logout">Logout</button>
      </div>
    </header>

    <div class="content">
      <div id="loading" class="text-muted">Memuat...</div>
      <div id="main-content" class="hidden">

        <div class="page-header">
          <div>
            <div class="page-header__title">
              Selamat datang, <span id="welcome-name"></span>
            </div>
            <div class="page-header__subtitle">FUCHS Commercial Operating System</div>
          </div>
        </div>

        <div class="card" style="max-width: 440px; margin-top: 8px;">
          <div class="card__title">Akun Kamu</div>
          <dl class="detail-grid" id="account-summary"></dl>
        </div>

      </div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/utils.js"></script>

<script>
  var NAV = [
    { type: 'section', label: 'ADMINISTRASI', roles: ['SUPER_ADMIN', 'ADMIN'] },
    { label: 'User Registry',   href: '/users/list.html', roles: ['SUPER_ADMIN', 'ADMIN'] },
    { label: 'Approval Matrix', disabled: true,           roles: ['SUPER_ADMIN', 'ADMIN'] }
  ]

  FCOS.initPage().then(function (user) {
    if (!FCOS.hasRole('SUPER_ADMIN', 'ADMIN')) {
      window.location.href = '/app.html'
      return
    }

    document.getElementById('topbar-name').textContent  = user.name
    document.getElementById('welcome-name').textContent = user.name.split(' ')[0]
    document.getElementById('sidebar-footer').innerHTML =
      '<div>' + escHtml(user.name) + '</div>' +
      '<div class="mt-4 text-small">' + FCOS.formatRoles(user.roles) + '</div>'

    document.getElementById('account-summary').innerHTML =
      '<dt>Nama</dt>'   + '<dd>' + escHtml(user.name)  + '</dd>' +
      '<dt>Email</dt>'  + '<dd>' + escHtml(user.email) + '</dd>' +
      '<dt>Role</dt>'   + '<dd>' + FCOS.formatRoles(user.roles) + '</dd>' +
      '<dt>Status</dt>' + '<dd>' + FCOS.statusBadge(user.status) + '</dd>'

    buildNav(user)

    document.getElementById('loading').style.display = 'none'
    document.getElementById('main-content').classList.remove('hidden')
  })

  function buildNav(user) {
    var nav = document.getElementById('sidebar-nav')
    nav.innerHTML = ''

    NAV.forEach(function (item) {
      var allowed = !item.roles ||
        item.roles.some(function (r) { return (user.roles || []).includes(r) })
      if (!allowed) return

      if (item.type === 'section') {
        var label = document.createElement('div')
        label.className   = 'sidebar__section-label'
        label.textContent = item.label
        nav.appendChild(label)
        return
      }

      if (item.disabled) {
        var span = document.createElement('span')
        span.className   = 'sidebar__nav-disabled'
        span.textContent = item.label + ' (coming soon)'
        span.style.cssText =
          'display:block; padding:10px 24px; color:#475569;' +
          'font-size:0.9rem; cursor:not-allowed;'
        nav.appendChild(span)
        return
      }

      var a = document.createElement('a')
      a.href        = item.href
      a.textContent = item.label
      if (window.location.pathname === item.href ||
          window.location.pathname.startsWith(item.href.replace('.html', ''))) {
        a.classList.add('active')
      }
      nav.appendChild(a)
    })
  }

  document.getElementById('btn-logout').addEventListener('click', function () {
    FCOS.logout()
  })

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLI-OSS — Dashboard</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar__logo"><img src="/images/fuchs-logo.png" alt="FLI" style="height:36px;display:block;margin-bottom:4px"><span style="font-size:10px;color:#aaa;display:block;line-height:1.3">Fuchs Lubricants Indonesia<br>One Stop Service</span></div>
    <nav class="sidebar__nav" id="sidebar-nav"></nav>
    <div class="sidebar__footer" id="sidebar-footer"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__title">Dashboard</div>
      <div class="topbar__user">
        <span id="topbar-name"></span>
        <button class="btn btn--secondary btn--sm" id="btn-logout">Logout</button>
      </div>
    </header>

    <div class="content">
      <div id="loading" class="text-muted">Memuat...</div>
      <div id="main-content" class="hidden">

        <div class="page-header">
          <div>
            <div class="page-header__title">
              Selamat datang, <span id="welcome-name"></span>
            </div>
            <div class="page-header__subtitle">FUCHS Commercial Operating System</div>
          </div>
        </div>

        <div class="card" style="max-width: 440px; margin-top: 8px;">
          <div class="card__title">Akun Kamu</div>
          <dl class="detail-grid" id="account-summary"></dl>
        </div>

      </div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/sidebar.js"></script>

<script>


  FCOS.initPage().then(function (user) {
    if (!FCOS.hasRole('SUPER_ADMIN', 'ADMIN')) {
      window.location.href = '/app.html'
      return
    }

    document.getElementById('topbar-name').textContent  = user.name
    document.getElementById('welcome-name').textContent = user.name.split(' ')[0]
    FCOS_SIDEBAR.build(user)

    document.getElementById('account-summary').innerHTML =
      '<dt>Nama</dt>'   + '<dd>' + escHtml(user.name)  + '</dd>' +
      '<dt>Email</dt>'  + '<dd>' + escHtml(user.email) + '</dd>' +
      '<dt>Role</dt>'   + '<dd>' + FCOS.formatRoles(user.roles) + '</dd>' +
      '<dt>Status</dt>' + '<dd>' + FCOS.statusBadge(user.status) + '</dd>'


    document.getElementById('loading').style.display = 'none'
    document.getElementById('main-content').classList.remove('hidden')
  })


  document.getElementById('btn-logout').addEventListener('click', function () {
    FCOS.logout()
  })

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }
</script>

</body>
</html>

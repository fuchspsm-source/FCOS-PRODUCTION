<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLI-OSS — Product Families</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar__logo"><img src="/images/fuchs-logo.png" alt="FLI" style="height:36px;display:block;margin-bottom:4px"><span style="font-size:10px;color:#aaa;display:block;line-height:1.3">Fuchs Lubricants Indonesia<br>One Stop Service</span></div>
    <nav class="sidebar__nav" id="sidebar-nav"></nav>
    <div class="sidebar__footer" id="sidebar-footer"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__title">Product Families</div>
      <div class="topbar__user">
        <span id="topbar-name"></span>
        <button class="btn btn--secondary btn--sm" id="btn-logout">Logout</button>
      </div>
    </header>

    <div class="content">
      <div id="loading" class="text-muted">Memuat...</div>
      <div id="main-content" class="hidden">

        <div class="page-header">
          <div>
            <div class="page-header__title">Product Families</div>
            <div class="page-header__subtitle" id="list-subtitle"></div>
          </div>
          <button class="btn btn--primary" id="btn-create">+ Tambah Family</button>
        </div>

        <!-- Search + Filter -->
        <div style="display:flex; gap:12px; align-items:center; margin-bottom:16px; flex-wrap:wrap;">
          <input type="text" id="search-input" class="form-control"
                 placeholder="Cari nama family..." style="max-width:280px;">
          <div class="filter-tabs" id="filter-status">
            <button class="filter-tab active" data-status="">Semua</button>
            <button class="filter-tab" data-status="ACTIVE">Active</button>
            <button class="filter-tab" data-status="INACTIVE">Inactive</button>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>Family Name</th>
                <th>Product Count</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="4" class="table-empty">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>

        <div id="pagination" style="display:flex; gap:8px; align-items:center; margin-top:16px; justify-content:flex-end;"></div>

      </div>
    </div>
  </div>
</div>

<!-- Modal: Create / Edit Family -->
<div id="modal-family" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title" id="modal-family-title">Tambah Family</div>
      <button class="modal__close" id="modal-family-close">&times;</button>
    </div>
    <div class="modal__body">
      <div id="modal-family-error" class="alert alert--error hidden"></div>
      <div class="form-group">
        <label class="form-label">Family Name <span style="color:#dc2626">*</span></label>
        <input type="text" id="input-family-name" class="form-control" placeholder="Contoh: RENOLIN B20">
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" id="modal-family-cancel">Batal</button>
      <button class="btn btn--primary"   id="modal-family-save">Simpan</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/sidebar.js"></script>

<script>
  var PAGE_SIZE     = 20
  var allFamilies   = []
  var countMap      = {}   // family_id → product count
  var filteredData  = []
  var currentPage   = 1
  var currentStatus = ''
  var editingId     = null
  var canEdit       = false

  FCOS.initPage().then(function (user) {
    FCOS.requirePageRole('SUPER_ADMIN', 'ADMIN', 'COMMERCIAL_ADMIN', 'PRICING')
    canEdit = user.roles.some(function (r) {
      return ['SUPER_ADMIN','ADMIN','COMMERCIAL_ADMIN'].includes(r)
    })
    if (!canEdit) document.getElementById('btn-create').style.display = 'none'

    document.getElementById('topbar-name').textContent  = user.name
    FCOS_SIDEBAR.build(user)

    document.getElementById('loading').style.display = 'none'
    document.getElementById('main-content').classList.remove('hidden')
    loadAll()
  })

  async function loadAll() {
    var tbody = document.getElementById('table-body')
    tbody.innerHTML = '<tr><td colspan="4" class="table-empty">Memuat...</td></tr>'
    try {
      var results = await Promise.all([
        FCOS.api('listFamilies', 'GET'),
        FCOS.api('listMappings', 'GET')
      ])
      allFamilies = results[0].families || []
      var mappings = results[1].mappings || []

      // Build product count per family
      countMap = {}
      mappings.forEach(function (m) {
        countMap[m.family_id] = (countMap[m.family_id] || 0) + 1
      })

      applyFilter()
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="4" class="table-empty text-danger">Gagal memuat: ' + escHtml(err.message) + '</td></tr>'
    }
  }

  function applyFilter() {
    var q = (document.getElementById('search-input').value || '').toLowerCase().trim()
    filteredData = allFamilies.filter(function (f) {
      if (currentStatus && f.status !== currentStatus) return false
      if (q && !(f.family_name || '').toLowerCase().includes(q)) return false
      return true
    })
    currentPage = 1
    renderTable()
  }

  function renderTable() {
    var total = filteredData.length
    var pages = Math.ceil(total / PAGE_SIZE) || 1
    if (currentPage > pages) currentPage = pages
    var start = (currentPage - 1) * PAGE_SIZE
    var slice = filteredData.slice(start, start + PAGE_SIZE)

    document.getElementById('list-subtitle').textContent =
      total + ' family' + (currentStatus ? ' (' + currentStatus.toLowerCase() + ')' : '')

    var tbody = document.getElementById('table-body')
    if (slice.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="table-empty">Tidak ada family.</td></tr>'
    } else {
      tbody.innerHTML = slice.map(function (f) {
        var cnt = countMap[f.family_id] || 0
        var actions = canEdit
          ? '<button class="btn btn--secondary btn--sm" onclick="openEdit(\'' + escAttr(f.family_id) + '\')">Edit</button> ' +
            (f.status === 'ACTIVE'
              ? '<button class="btn btn--danger btn--sm" onclick="doDeactivate(\'' + escAttr(f.family_id) + '\')">Nonaktifkan</button>'
              : '<button class="btn btn--success btn--sm" onclick="doReactivate(\'' + escAttr(f.family_id) + '\')">Aktifkan</button>')
          : '—'
        return '<tr>' +
          '<td>' + escHtml(f.family_name) + '</td>' +
          '<td>' +
            '<a href="/products/mapping.html?family_id=' + encodeURIComponent(f.family_id) + '" ' +
               'style="font-weight:600; color:#1a56db;">' + cnt + ' product' + (cnt !== 1 ? 's' : '') + '</a>' +
          '</td>' +
          '<td>' + FCOS.statusBadge(f.status) + '</td>' +
          '<td style="white-space:nowrap;">' + actions + '</td>' +
          '</tr>'
      }).join('')
    }
    renderPagination(pages)
  }

  function renderPagination(pages) {
    var el = document.getElementById('pagination')
    if (pages <= 1) { el.innerHTML = ''; return }
    var html = ''
    if (currentPage > 1)  html += '<button class="btn btn--secondary btn--sm" onclick="goPage(' + (currentPage-1) + ')">← Prev</button>'
    html += '<span class="text-small text-muted" style="padding:0 8px;">Hal ' + currentPage + ' / ' + pages + '</span>'
    if (currentPage < pages) html += '<button class="btn btn--secondary btn--sm" onclick="goPage(' + (currentPage+1) + ')">Next →</button>'
    el.innerHTML = html
  }
  function goPage(n) { currentPage = n; renderTable() }

  document.getElementById('filter-status').addEventListener('click', function (e) {
    var tab = e.target.closest('.filter-tab')
    if (!tab) return
    document.querySelectorAll('#filter-status .filter-tab').forEach(function (t) { t.classList.remove('active') })
    tab.classList.add('active')
    currentStatus = tab.dataset.status
    applyFilter()
  })
  document.getElementById('search-input').addEventListener('input', applyFilter)

  document.getElementById('btn-create').addEventListener('click', function () {
    editingId = null
    document.getElementById('modal-family-title').textContent = 'Tambah Family'
    document.getElementById('input-family-name').value = ''
    hideErr('modal-family-error')
    document.getElementById('modal-family').classList.remove('hidden')
  })

  function openEdit(family_id) {
    var f = allFamilies.find(function (x) { return x.family_id === family_id })
    if (!f) return
    editingId = family_id
    document.getElementById('modal-family-title').textContent = 'Edit Family'
    document.getElementById('input-family-name').value = f.family_name || ''
    hideErr('modal-family-error')
    document.getElementById('modal-family').classList.remove('hidden')
  }

  document.getElementById('modal-family-save').addEventListener('click', async function () {
    var btn         = this
    var family_name = document.getElementById('input-family-name').value.trim()
    if (!family_name) { showErr('modal-family-error', 'Family Name wajib diisi.'); return }
    hideErr('modal-family-error')
    FCOS.setLoading(btn, 'Menyimpan...')
    try {
      if (editingId) {
        await FCOS.api('updateFamily', 'POST', { family_id: editingId, family_name })
      } else {
        await FCOS.api('createFamily', 'POST', { family_name })
      }
      closeFamilyModal()
      await loadAll()
    } catch (err) {
      showErr('modal-family-error', err.message)
    } finally {
      FCOS.clearLoading(btn)
    }
  })

  async function doDeactivate(family_id) {
    var f = allFamilies.find(function (x) { return x.family_id === family_id })
    if (!window.confirm('Nonaktifkan family "' + (f ? f.family_name : family_id) + '"?')) return
    try { await FCOS.api('deactivateFamily', 'POST', { family_id }); await loadAll() }
    catch (err) { alert('Gagal: ' + err.message) }
  }

  async function doReactivate(family_id) {
    var f = allFamilies.find(function (x) { return x.family_id === family_id })
    if (!window.confirm('Aktifkan kembali family "' + (f ? f.family_name : family_id) + '"?')) return
    try { await FCOS.api('reactivateFamily', 'POST', { family_id }); await loadAll() }
    catch (err) { alert('Gagal: ' + err.message) }
  }

  document.getElementById('modal-family-close').addEventListener('click', closeFamilyModal)
  document.getElementById('modal-family-cancel').addEventListener('click', closeFamilyModal)
  function closeFamilyModal() {
    document.getElementById('modal-family').classList.add('hidden')
    editingId = null
  }

  document.getElementById('btn-logout').addEventListener('click', function () { FCOS.logout() })

  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }
  function escAttr(str) { return escHtml(str) }
  function showErr(id, msg) { var e = document.getElementById(id); e.textContent = msg; e.classList.remove('hidden') }
  function hideErr(id)      { var e = document.getElementById(id); e.textContent = '';  e.classList.add('hidden') }
</script>

</body>
</html>

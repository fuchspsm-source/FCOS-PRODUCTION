<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail PO — FLI Portal</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/portal.css">
  <style>
    .topbar { background:#fff; border-bottom:3px solid #C74437; padding:0 32px; height:56px; display:flex; align-items:center; justify-content:space-between; }
    .topbar__logo { font-size:1rem; font-weight:700; color:#C74437; letter-spacing:.04em; }
    .topbar__user { display:flex; align-items:center; gap:12px; font-size:.88rem; color:#475569; }
    .po-badge { display:inline-block; padding:3px 12px; border-radius:100px; font-size:.78rem; font-weight:700; background:#dcfce7; color:#166534; }
    .detail-card { max-width:760px; margin:0 auto; }
    .po-number-display { font-size:1.6rem; font-weight:800; color:#1a1a2e; margin-bottom:4px; }
    .action-bar { display:flex; gap:12px; margin-top:24px; }
  </style>
</head>
<body style="background:#f4f6f9; min-height:100vh;">

<header class="topbar">
  <div class="topbar__logo">FLI Customer Portal</div>
  <div class="topbar__user">
    <a href="/po/new.html" class="btn btn--secondary btn--sm">← Buat PO Baru</a>
    <button class="btn btn--secondary btn--sm" onclick="PORTAL.logout()">Logout</button>
  </div>
</header>

<div style="padding:28px 32px;">
<div class="detail-card">

  <div id="loading" class="text-muted" style="padding:40px 0;">Memuat PO...</div>
  <div id="error-box" class="alert alert--error hidden"></div>

  <div id="main-content" class="hidden">

    <div class="page-header" style="margin-bottom:20px;">
      <div>
        <div style="font-size:.8rem;color:#64748b;margin-bottom:4px;">PURCHASE ORDER</div>
        <div class="po-number-display" id="display-po-ref"></div>
        <div style="font-size:.82rem;color:#94a3b8;margin-top:2px;" id="display-po-sys"></div>
      </div>
      <span class="po-badge">CONFIRMED</span>
    </div>

    <!-- PO INFO CARD -->
    <div class="card">
      <div class="card__title">Informasi PO</div>
      <dl class="detail-grid" style="grid-template-columns:160px 1fr;">
        <dt>Tanggal</dt>        <dd id="info-date">—</dd>
        <dt>Customer</dt>       <dd id="info-customer">—</dd>
        <dt>Kode Customer</dt>  <dd id="info-customer-code">—</dd>
        <dt>Alamat Customer</dt><dd id="info-customer-address">—</dd>
        <dt>Ship-To</dt>        <dd id="info-shipto">—</dd>
        <dt>Alamat Kirim</dt>   <dd id="info-shipto-address">—</dd>
        <dt>Segment</dt>        <dd id="info-segment">—</dd>
      </dl>
    </div>

    <!-- LINE ITEMS -->
    <div class="card" style="margin-top:16px;">
      <div class="card__title">Daftar Produk</div>
      <div class="table-wrapper" style="border:none;">
        <table class="table">
          <thead>
            <tr>
              <th>#</th>
              <th>Material Code</th>
              <th>Description</th>
              <th style="text-align:center;">Qty</th>
              <th style="text-align:right;">Unit Price</th>
              <th style="text-align:right;">Net Amount</th>
            </tr>
          </thead>
          <tbody id="lines-body"></tbody>
        </table>
      </div>

      <!-- Totals -->
      <div style="display:flex;justify-content:flex-end;margin-top:16px;">
        <table style="width:280px;font-size:.9rem;">
          <tr><td style="color:#64748b;padding:4px 10px;">Subtotal</td>
              <td style="text-align:right;font-weight:600;padding:4px 10px;" id="total-subtotal">—</td></tr>
          <tr><td style="color:#64748b;padding:4px 10px;">PPN 11%</td>
              <td style="text-align:right;padding:4px 10px;" id="total-ppn">—</td></tr>
          <tr style="border-top:2px solid #1a3c6b;">
            <td style="font-weight:700;padding:10px 10px 4px;">Grand Total</td>
            <td style="text-align:right;font-weight:800;color:#C74437;font-size:1.05rem;padding:10px 10px 4px;" id="total-grand">—</td>
          </tr>
        </table>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="action-bar">
      <button id="btn-pdf" class="btn btn--primary" onclick="downloadPdf()">
        ⬇ Download PDF
      </button>
      <a href="/po/new.html" class="btn btn--secondary">Buat PO Baru</a>
    </div>

  </div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/portal-api.js"></script>
<script src="/js/portal-auth.js"></script>
<script>

var po_number = new URLSearchParams(window.location.search).get('po_number')

PORTAL.initPage().then(function(user) {
  if (!po_number) {
    showError('PO number tidak ditemukan di URL.')
    return
  }
  loadPoDetail()
})

async function loadPoDetail() {
  try {
    // Load PO header via portalGetPoPdf ownership check is backend-enforced
    // We use a lightweight approach: hit portalBootstrap for customer data
    // then load po_headers via a dedicated read endpoint
    // Since we don't have a portalGetPoDetail endpoint yet,
    // we derive display data from what we know + PDF metadata

    // Actually: use existing portalBootstrap for customer context
    // and display po_number from URL — then just offer PDF download
    // Full detail needs portalGetPoDetail (future package)
    // For now: show what we know from URL + bootstrap

    var bootstrap = await PORTAL.api('portalBootstrap', 'GET')
    var cust = bootstrap.customer

    // Set PO number display
    document.getElementById('display-po-ref').textContent = po_number
    document.getElementById('display-po-sys').textContent = 'No. Sistem: ' + po_number

    // Fill customer info
    document.getElementById('info-customer').textContent         = cust.customer_name || '—'
    document.getElementById('info-customer-code').textContent    = cust.customer_code || '—'
    document.getElementById('info-customer-address').textContent = cust.address || '—'

    // Set date = today (PO was just created)
    document.getElementById('info-date').textContent = new Date().toLocaleDateString('id-ID', {
      day: '2-digit', month: 'long', year: 'numeric'
    })

    document.getElementById('loading').classList.add('hidden')
    document.getElementById('main-content').classList.remove('hidden')

  } catch(err) {
    showError('Gagal memuat data: ' + err.message)
  }
}

async function downloadPdf() {
  var btn = document.getElementById('btn-pdf')
  btn.disabled = true
  btn.textContent = 'Mengunduh...'

  try {
    var blob = await PORTAL.api('portalGetPoPdf', 'GET', null, { po_number: po_number })
    var url  = URL.createObjectURL(blob)
    var a    = document.createElement('a')
    a.href     = url
    a.download = po_number + '.pdf'
    document.body.appendChild(a)
    a.click()
    document.body.removeChild(a)
    URL.revokeObjectURL(url)
  } catch(err) {
    if (err.status === 403) {
      showError('Akses ditolak: PO ini bukan milik akun Anda.')
    } else {
      showError('Gagal mengunduh PDF: ' + err.message)
    }
  }

  btn.disabled    = false
  btn.textContent = '⬇ Download PDF'
}

function showError(msg) {
  document.getElementById('loading').classList.add('hidden')
  var el = document.getElementById('error-box')
  el.textContent = msg
  el.classList.remove('hidden')
}

function fmtRp(num) {
  if (!num && num !== 0) return '—'
  return 'Rp ' + Number(num).toLocaleString('id-ID', { maximumFractionDigits: 0 })
}

</script>
</body>
</html>
